<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="ds-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3B82F6" />
            <stop offset="50%" stop-color="#4F46E5" />
            <stop offset="100%" stop-color="#06B6D4" />
        </linearGradient>

        <!-- Signature Flow Gradient -->
        <linearGradient id="ds-sig" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="60%" stop-color="#E0F2FE" />
            <stop offset="100%" stop-color="#38BDF8" />
        </linearGradient>
    </defs>

    <!-- Outer Squircle Frame with Glossy Highlight -->
    <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#ds-bg)" />
    <rect x="2.5" y="2.5" width="43" height="43" rx="11.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />

    <!-- Smart Display Screen Frame -->
    <rect x="7" y="10" width="34" height="22" rx="4" fill="#0F172A" fill-opacity="0.38" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.3" />

    <!-- Digital Grid Subtle Guidelines -->
    <line x1="10" y1="17" x2="38" y2="17" stroke="#FFFFFF" stroke-opacity="0.12" stroke-dasharray="1.5 2" stroke-width="0.8" />
    <line x1="10" y1="24" x2="38" y2="24" stroke="#FFFFFF" stroke-opacity="0.12" stroke-dasharray="1.5 2" stroke-width="0.8" />

    <!-- Fluid Digital Signature Flow Mark (D & S Flourish) -->
    <path d="M12 26C13.5 20 16 15 20.5 15C24.5 15 23.5 20.5 20 23.5C17.5 25.5 20.5 27.5 25 24C29 21 31 18 35.5 17.5" 
          stroke="url(#ds-sig)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Signature Glow Tip (Live Broadcast & Auth Pin) -->
    <circle cx="35.5" cy="17.5" r="2.2" fill="#38BDF8" />
    <circle cx="35.5" cy="17.5" r="3.4" stroke="#38BDF8" stroke-width="0.7" stroke-opacity="0.6" />

    <!-- Screen Stand & Base -->
    <path d="M21 32H27V34.5C27 35 26.5 35.5 26 35.5H22C21.5 35.5 21 35 21 34.5V32Z" fill="#FFFFFF" fill-opacity="0.75" />
    <rect x="17" y="35.5" width="14" height="1.8" rx="0.9" fill="#FFFFFF" fill-opacity="0.9" />

    <!-- Live Status Heartbeat Beacon (Top-Right) -->
    <circle cx="36" cy="6.5" r="1.8" fill="#10B981" />
    <circle cx="36" cy="6.5" r="2.8" stroke="#10B981" stroke-width="0.6" stroke-opacity="0.5" />
</svg>

