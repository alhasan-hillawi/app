name: signage_player
description: Enterprise Digital Signage OS Client Player for Android TV, Tablets & Displays.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الاتصال بالشبكة
  dio: ^5.4.1
  connectivity_plus: ^6.1.1

  # التخزين والأمان
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.2

  # إدارة الحالة
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # مشغلات الوسائط المتقدمة
  video_player: ^2.8.2
  chewie: ^1.7.5
  cached_network_image: ^3.3.1
  audioplayers: ^6.1.0

  # محرك عرض صفحات الويب ولوحات المعلومات
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.15.0

  # معلومات العتاد والشبكة والقرص
  device_info_plus: ^10.1.2
  network_info_plus: ^6.0.1
  disk_space_plus: ^0.2.1

  # أدوات الكشك والتحكم بالشاشة والخطوط
  wakelock_plus: ^1.1.4
  marquee: ^2.2.3
  intl: ^0.20.3
  google_fonts: ^6.1.0
  webview_flutter_wkwebview: ^3.27.2
  webview_flutter_web: ^0.2.3+4
  webview_windows: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
    - assets/fonts/
    - google_fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
